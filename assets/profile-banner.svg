<svg width="100%" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="35%" stop-color="#1e1b4b"/>
    <stop offset="70%" stop-color="#312e81"/>
    <stop offset="100%" stop-color="#0e7490"/>
  </linearGradient>
  <radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".95"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="green"><stop stop-color="#34d399" stop-opacity=".75"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  <radialGradient id="pink"><stop stop-color="#f472b6" stop-opacity=".65"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fff" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#fff" stop-opacity=".035"/>
  </linearGradient>
  <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop stop-color="#fff"/><stop offset="1" stop-color="#a5f3fc"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="420" fill="url(#bg)"/>

<g opacity=".9">
  <circle cx="170" cy="75" r="170" fill="url(#cyan)" filter="url(#blur)">
    <animate attributeName="cx" values="170;250;170" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="350" r="220" fill="url(#violet)" filter="url(#blur)">
    <animate attributeName="cy" values="350;295;350" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="990" cy="85" r="170" fill="url(#green)" filter="url(#blur)">
    <animate attributeName="cx" values="990;920;990" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="350" r="150" fill="url(#pink)" filter="url(#blur)">
    <animate attributeName="cy" values="350;390;350" dur="10s" repeatCount="indefinite"/>
  </circle>
</g>

<g stroke="#fff" stroke-opacity=".05">
  <path d="M0 125H1200M0 220H1200M0 315H1200"/>
  <path d="M150 0V420M420 0V420M700 0V420M980 0V420"/>
</g>

<!-- terminal bar -->
<g filter="url(#shadow)">
  <rect x="55" y="24" width="1090" height="58" rx="29" fill="url(#glass)" stroke="#fff" stroke-opacity=".28"/>
</g>
<g font-family="Consolas,Menlo,monospace" font-size="14">
  <circle cx="83" cy="53" r="5" fill="#f472b6"/>
  <circle cx="101" cy="53" r="5" fill="#fbbf24"/>
  <circle cx="119" cy="53" r="5" fill="#34d399"/>
  <text x="145" y="58" fill="#a5f3fc">~/arunessential › devops-engineer --status active</text>
  <text x="925" y="58" fill="#67e8f9">● LIVE PROFILE</text>
</g>

<!-- main card -->
<g filter="url(#shadow)">
  <rect x="55" y="110" width="735" height="255" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
</g>
<text x="92" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" fill="url(#title)">Arun Kumar Rout</text>
<text x="92" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#e0f2fe">DevOps Engineer &amp; Cloud Engineer</text>
<text x="92" y="250" font-family="Consolas,Menlo,monospace" font-size="14" fill="#67e8f9">
  5+ yrs · AWS · Azure · GCP · Kubernetes · Terraform · Docker · CI/CD
</text>

<!-- pills -->
<g font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">
  <g transform="translate(92 275)">
    <rect width="118" height="30" rx="15" fill="url(#glass)" stroke="#fff" stroke-opacity=".28"/>
    <text x="59" y="20" text-anchor="middle">AWS · Azure</text>
  </g>
  <g transform="translate(220 275)">
    <rect width="120" height="30" rx="15" fill="url(#glass)" stroke="#fff" stroke-opacity=".28"/>
    <text x="60" y="20" text-anchor="middle">Kubernetes</text>
  </g>
  <g transform="translate(350 275)">
    <rect width="105" height="30" rx="15" fill="url(#glass)" stroke="#fff" stroke-opacity=".28"/>
    <text x="52" y="20" text-anchor="middle">Terraform</text>
  </g>
  <g transform="translate(465 275)">
    <rect width="110" height="30" rx="15" fill="url(#glass)" stroke="#fff" stroke-opacity=".28"/>
    <text x="55" y="20" text-anchor="middle">Docker</text>
  </g>
  <g transform="translate(585 275)">
    <rect width="125" height="30" rx="15" fill="url(#glass)" stroke="#fff" stroke-opacity=".28"/>
    <text x="62" y="20" text-anchor="middle">CI/CD · Ansible</text>
  </g>
</g>

<text x="92" y="337" font-family="Consolas,Menlo,monospace" font-size="12" fill="#94a3b8">$ build → deploy → monitor → improve</text>

<!-- live stats -->
<g filter="url(#shadow)">
  <rect x="815" y="72" width="330" height="293" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
</g>
<text x="842" y="108" font-family="Consolas,Menlo,monospace" font-size="12" fill="#67e8f9">SYSTEM.STATUS</text>

<text x="842" y="157" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">5+</text>
<text x="842" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#94a3b8">years experience</text>
<line x1="842" y1="193" x2="1115" y2="193" stroke="#fff" stroke-opacity=".12"/>

<text x="842" y="235" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">AWS + Azure</text>
<text x="842" y="255" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#94a3b8">cloud platforms</text>
<line x1="842" y1="271" x2="1115" y2="271" stroke="#fff" stroke-opacity=".12"/>

<text x="842" y="313" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">DevOps</text>
<text x="842" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#94a3b8">automation &amp; delivery</text>

<!-- animated status bars -->
<g transform="translate(842 350)">
  <rect x="0" y="10" width="9" height="0" fill="#22d3ee">
    <animate attributeName="height" values="0;15;7;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="10;-5;3;10" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="15" y="10" width="9" height="0" fill="#a78bfa">
    <animate attributeName="height" values="0;20;10;0" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="10;-10;0;10" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="30" y="10" width="9" height="0" fill="#f472b6">
    <animate attributeName="height" values="0;14;22;0" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="10;-4;-12;10" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <text x="54" y="10" font-family="Consolas,Menlo,monospace" font-size="10" fill="#67e8f9">deploying...</text>
</g>

<!-- hex badge -->
<g transform="translate(1085 125)">
  <circle r="37" fill="none" stroke="#fff" stroke-opacity=".15"/>
  <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#fff" fill-opacity=".07" stroke="#a5f3fc" stroke-opacity=".65" stroke-width="1.5"/>
  <polygon points="0,-12 11,-6 11,6 0,12 -11,6 -11,-6" fill="#22d3ee" fill-opacity=".4"/>
  <circle r="3" fill="#67e8f9" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M37 0 A37 37 0 1 1 -37 0 A37 37 0 1 1 37 0"/>
  </circle>
</g>

<circle cx="150" cy="390" r="3" fill="#67e8f9">
  <animate attributeName="cy" values="390;380;390" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="1130" cy="40" r="3" fill="#a5f3fc">
  <animate attributeName="cy" values="40;52;40" dur="5s" repeatCount="indefinite"/>
</circle>
</svg>
